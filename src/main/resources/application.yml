spring:
  application:
    name: enterprise-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  profiles:
    active: hikari
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:enterprise;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${spring.application.name}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: dev.markodojkic
  quartz:
    job-store-type: memory
  cloud:
    discovery:
      enabled: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: 8080

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}

app:
  ldap:
    enabled: ${APP_LDAP_ENABLED:false}
    url: ${LDAP_URL:ldap://localhost:10389}
    base: ${LDAP_BASE:dc=example,dc=org}
    manager-dn: ${LDAP_MANAGER_DN:uid=admin,ou=system}
    manager-password: ${LDAP_MANAGER_PASSWORD:secret}
  datasource:
    pool: hikari
  jwt:
    secret: change-this-development-secret-to-at-least-32-characters
  feign:
    rules-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

jasypt:
  encryptor:
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
