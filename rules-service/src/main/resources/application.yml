spring:
  application:
    name: rules-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:hikari}
  cloud:
    discovery:
      enabled: true

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
